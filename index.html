<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز التسوق - مجموعة ملصقات مميزة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0c111c; color: #ffffff; padding: 16px; padding-bottom: 90px; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .hub-icon { font-size: 24px; }
        .hub-title { font-weight: bold; color: #ff9800; font-size: 18px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #131826; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222b3c; z-index: 1000; }
        .nav-item { background: none; border: none; color: #8c9bae; cursor: pointer; font-size: 14px; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #ff9800; }
        .card { background: #131826; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="app-header">
        <div class="logo-area">
            <span class="hub-icon">⚡</span>
            <span class="hub-title">STICKER HUB</span>
        </div>
    </header>

    <!-- الصفحة الرئيسية -->
    <div id="home-tab" class="tab-content active">
        <div class="card">
            <h3>أهلاً بك في صانع الملصقات المميز</h3>
            <p>الملصقات المميزة الاحترافية في التليجرام بلكليك وسورس المساعدة.</p>
        </div>
    </div>

    <!-- صفحة إنشاء ملصق -->
    <div id="create-tab" class="tab-content">
        <div class="card">
            <h3>تجربة مصمم - صنع ملصقات مميزة</h3>
            <p>انجز قلباً ليند تصميم الملصق.</p>
            <div style="border: 2px dashed #3a4b6c; padding: 20px; border-radius: 10px; margin-top: 10px;">
                إرسال ملصق جديد ليصبح الباقي
            </div>
        </div>
    </div>

    <!-- صفحة حزمي -->
    <div id="packs-tab" class="tab-content">
        <div class="card">
            <h3>حزمي وملصقاتي المسجلة</h3>
            <p>ليس لديك حزم ملصقات مسجلة حالياً.</p>
        </div>
    </div>

    <!-- الشريط السفلي (Navigation Bar) -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="switchTab('packs-tab', this)">
            <span>📦</span>
            <span>حزمي</span>
        </button>
        <button class="nav-item" onclick="switchTab('create-tab', this)">
            <span>➕</span>
            <span>إنشاء ملصق</span>
        </button>
        <button class="nav-item active" onclick="switchTab('home-tab', this)">
            <span>🏠</span>
            <span>الرئيسية</span>
        </button>
    </nav>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }
    </script>
</body>
</html>
