<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STICKER HUB</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d131d;
      color: #ffffff;
      padding: 16px;
      padding-bottom: 80px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .banner {
      width: 100%;
      height: 90px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d4ed8 0%, #0284c7 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      font-weight: bold;
      color: #38bdf8;
    }

    .section-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .section-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
    }

    .card-desc {
      font-size: 13px;
      color: #64748b;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #f59e0b;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748b;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <span>👑</span> STICKER HUB
    </div>
  </div>

  <div class="section-title">إنشاء ملصق</div>
  <div class="section-subtitle">اختر طريقة بداية</div>

  <div class="banner">
    ✨ اشترك بعضوية VIP
  </div>

  <div class="card" onclick="selectOption('template')">
    <div class="card-info">
      <div class="card-title">إنشاء من قالب</div>
      <div class="card-desc">اختر قالب متحرك وأضف اسمك...</div>
    </div>
    <div class="card-icon">✨</div>
  </div>

  <div class="card" onclick="selectOption('text_only')">
    <div class="card-info">
      <div class="card-title">نص بدون قالب</div>
      <div class="card-desc">ملصق نصي بخلفية شفافة بالكامل</div>
    </div>
    <div class="card-icon">T</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <span>🏠</span>
      <span>الرئيسية</span>
    </div>
    <div class="nav-item active">
      <span>➕</span>
      <span>إنشاء ملصق</span>
    </div>
    <div class="nav-item">
      <span>📦</span>
      <span>حزمي</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function selectOption(type) {
      tg.sendData(JSON.stringify({ action: type }));
    }
  </script>

</body>
</html>
