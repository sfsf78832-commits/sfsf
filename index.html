    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBase: '#020204', glassBg: 'rgba(10, 10, 15, 0.7)', accentPurple: '#a855f7', accentCyan: '#06b6d4', accentGold: '#eab308' },
                    fontFamily: { sans: ['Tajawal', 'Plus Jakarta Sans', 'sans-serif'], mono: ['Plus Jakarta Sans', 'monospace'] }

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background-color: #020204;
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .glass-card {
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(168, 85, 247, 0.15);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 1;
        }
        .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%); top: 10%; left: 10%; animation: floatOrb 10s infinite alternate ease-in-out; }
        .orb-2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0,0,0,0) 70%); bottom: 10%; right: 10%; animation: floatOrb 12s infinite alternate-reverse ease-in-out; }
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 30px) scale(1.15); } }

        #mouse-glow {
            pointer-events: none;
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.07) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* شاشة الترحيب بالمنتصف تماماً */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 4, 0.97);
            backdrop-filter: blur(30px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
            z-index: 100;
            cursor: pointer;
        }

        .pulse-text {
            animation: glowPulse 2s infinite ease-in-out;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
            50% { opacity: 1; text-shadow: 0 0 25px rgba(168, 85, 247, 0.9), 0 0 40px rgba(6, 182, 212, 0.7); }
        }

        .social-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.3);
        }

        .poetry-box {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .poetry-box::before {
            content: '“';
            position: absolute;
            top: -10px;
            right: 15px;
            font-size: 50px;
            color: rgba(168, 85, 247, 0.2);
            font-family: Georgia, serif;
        }

        #toast {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateY(100px);
            opacity: 0;
            z-index: 90;
        }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
