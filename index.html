<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STICKER HUB</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d131d; color: #ffffff; padding: 16px; padding-bottom: 90px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; letter-spacing: 1px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .banner { width: 100%; height: 90px; border-radius: 16px; background: linear-gradient(135deg, #1d4ed8 0%, #0284c7 50%, #0f172a 100%); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); font-weight: bold; color: #38bdf8; }
    .section-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .section-subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; cursor: pointer; backdrop-filter: blur(10px); }
    .card-info { display: flex; flex-direction: column; gap: 4px; }
    .card-title { font-size: 16px; font-weight: bold; }
    .card-desc { font-size: 13px; color: #64748b; }
    .card-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #f59e0b; }
    .preview-box { width: 100%; height: 220px; background: #151c28; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 16px; overflow: hidden; }
    #previewText { font-size: 24px; color: #ffffff; text-align: center; word-break: break-all; padding: 10px; }
    .input-group { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
    .input-group input, .input-group select { width: 100%; background: transparent; border: none; color: white; font-size: 15px; outline: none; text-align: right; }
    .input-group select option { background: #1e293b; color: white; }
    .tabs-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .tab-btn { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #0284c7; color: white; border-color: #38bdf8; }
    .control-panel { background: rgba(30, 41, 59, 0.5); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: #cbd5e1; }
    .control-row input[type="range"] { width: 60%; }
    .control-row input[type="color"] { border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; background: none; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); margin-bottom: 10px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #0f172a; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { display: flex; flexDirection: column; align-items: center; gap: 4px; color: #64748b; font-size: 12px; cursor: pointer; }
    .nav-item.active { color: #38bdf8; }
  </style>
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <div id="homeScreen" class="screen active">
    <div class="header">
      <div class="logo"><span>👑</span> STICKER HUB</div>
    </div>
    <div class="section-title">صنع ملصقات مميز...</div>
    <div class="section-subtitle">اختر قالبأ</div>
    <div class="banner">✨ اشترك بعضوية VIP</div>
    <div class="card" onclick="goToEditor()">
      <div class="card-info">
        <div class="card-title">إنشاء من قالب</div>
        <div class="card-desc">اختر قالب وأضف اسمك...</div>
      </div>
      <div class="card-icon">✨</div>
    </div>
  </div>

  <!-- شاشة تصميم الملصق -->
  <div id="editorScreen" class="screen">
    <div class="header">
      <div class="logo" onclick="goHome()" style="cursor: pointer;"><span>⬅️</span> تصميم الملصق</div>
    </div>
    <div class="preview-box">
      <div id="previewText">اكتب اسمك هنا...</div>
    </div>
    <div class="input-group">
      <input type="text" id="stickerInput" placeholder="اكتب النص هنا..." oninput="updateText(this.value)">
    </div>

    <!-- شريط الأدوات -->
    <div class="tabs-bar">
      <div class="tab-btn active" onclick="switchTab(this, 'colorTab')">لون الخط</div>
      <div class="tab-btn" onclick="switchTab(this, 'zoomTab')">الزوم</div>
      <div class="tab-btn" onclick="switchTab(this, 'sizeTab')">حجم الخط</div>
    </div>

    <div class="control-panel">
      <div id="colorTab" class="tab-content">
        <div class="control-row">
          <span>لون النص</span>
          <input type="color" id="textColorPicker" value="#ffffff" oninput="changeColor(this.value)">
        </div>
      </div>
      <div id="zoomTab" class="tab-content" style="display: none;">
        <div class="control-row">
          <span>تكبير / تصغير</span>
          <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="changeZoom(this.value)">
        </div>
      </div>
      <div id="sizeTab" class="tab-content" style="display: none;">
        <div class="control-row">
          <span>حجم الخط</span>
          <input type="range" min="14" max="50" value="24" oninput="changeSize(this.value)">
        </div>
      </div>
    </div>

    <button class="btn-primary" onclick="openPackModal()">متابعة (اختيار الحزمة)</button>
  </div>

  <!-- شاشة اختيار أو إنشاء حزمة الملصقات -->
  <div id="packScreen" class="screen">
    <div class="header">
      <div class="logo" onclick="goToEditor()" style="cursor: pointer;"><span>⬅️</span> حزمة الملصقات</div>
    </div>
    <div class="section-title">إدارة حزمة الملصقات</div>
    <div class="section-subtitle">اختر الحزمة الحالية أو أنشئ حزمة جديدة</div>

    <div class="input-group">
      <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px;">اختر حزمة موجودة:</label>
      <select id="existingPacks">
        <option value="new">➕ إنشاء حزمة جديدة...</option>
        <option value="pack_1">حزمة ملصقاتي الأولى (MyPack1)</option>
      </select>
    </div>

    <div class="input-group" id="newPackGroup">
      <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px;">اسم الحزمة الجديدة:</label>
      <input type="text" id="newPackNameInput" placeholder="مثال: MyStickers_Bot">
    </div>

    <button class="btn-primary" onclick="finalSubmit()">إنشاء الحزمة وإرسال الملصق</button>
  </div>

  <!-- الشريط السفلي -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="goHome()"><span>🏠</span><span>الرئيسية</span></div>
    <div class="nav-item active"><span>➕</span><span>إنشاء ملصق</span></div>
    <div class="nav-item"><span>📦</span><span>حزمي</span></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function goToEditor() {
      document.getElementById('homeScreen').classList.remove('active');
      document.getElementById('packScreen').classList.remove('active');
      document.getElementById('editorScreen').classList.add('active');
    }

    function goHome() {
      document.getElementById('editorScreen').classList.remove('active');
      document.getElementById('packScreen').classList.remove('active');
      document.getElementById('homeScreen').classList.add('active');
    }

    function openPackModal() {
      const text = document.getElementById('stickerInput').value;
      if(!text) {
        alert('الرجاء كتابة النص أولاً!');
        return;
      }
      document.getElementById('editorScreen').classList.remove('active');
      document.getElementById('packScreen').classList.add('active');
    }

    function updateText(val) {
      document.getElementById('previewText').innerText = val ? val : "اكتب اسمك هنا...";
    }

    function switchTab(element, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
      element.classList.add('active');
      document.getElementById(tabId).style.display = 'block';
    }

    function changeColor(color) { document.getElementById('previewText').style.color = color; }
    function changeZoom(scale) { document.getElementById('previewText').style.transform = `scale(${scale})`; }
    function changeSize(size) { document.getElementById('previewText').style.fontSize = size + 'px'; }

    function finalSubmit() {
      const text = document.getElementById('stickerInput').value;
      const selectedPack = document.getElementById('existingPacks').value;
      const newPackName = document.getElementById('newPackNameInput').value;

      let packChoice = selectedPack === 'new' ? (newPackName || 'DefaultPack') : selectedPack;

      tg.sendData(JSON.stringify({
        action: 'create_sticker_pack',
        text: text,
        pack_name: packChoice
      }));
      tg.close();
    }
  </script>
</body>
</html>
