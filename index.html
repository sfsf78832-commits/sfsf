<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفصف | SAFSAF VIP BIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBase: '#020204', glassBg: 'rgba(10, 10, 15, 0.7)', accentPurple: '#a855f7', accentCyan: '#06b6d4', accentGold: '#eab308' },
                    fontFamily: { sans: ['Tajawal', 'Plus Jakarta Sans', 'sans-serif'], mono: ['Plus Jakarta Sans', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        /* ضبط التوسيط الكامل للشاشة والمحتوى */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #020204;
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .glass-card {
            background: rgba(8, 8, 12, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(168, 85, 247, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 1;
        }
        .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%); top: -100px; left: -100px; animation: floatOrb 10s infinite alternate ease-in-out; }
        .orb-2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0,0,0,0) 70%); bottom: -100px; right: -100px; animation: floatOrb 12s infinite alternate-reverse ease-in-out; }
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 30px) scale(1.15); } }

        #mouse-glow {
            pointer-events: none;
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.07) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%);
            z-index: 2;
        }
