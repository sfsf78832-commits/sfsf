<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفصف | SAFSAF VIP BIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background-color: #020204; color: #ffffff; font-family: 'Tajawal', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; position: relative; }
        
        .glass-card { background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 40px rgba(168, 85, 247, 0.15); opacity: 0; transform: scale(0.95); transition: all 0.8s ease-out; }
        .glass-card.show { opacity: 1; transform: scale(1); }

        /* شاشة الدخول والـ Prank المرعبة */
        #splash-screen {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: #020204; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; cursor: pointer;
            transition: opacity 0.6s ease;
        }
        .pulse-text { animation: glowPulse 2s infinite ease-in-out; }
        @keyframes glowPulse { 0%, 100% { opacity: 0.5; text-shadow: 0 0 10px rgba(255,255,255,0.2); } 50% { opacity: 1; text-shadow: 0 0 25px rgba(168, 85, 247, 0.9); } }

        /* شاشة الهكر المرعبة */
        #hacker-screen {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: #000000; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
            font-family: monospace; text-align: center; padding: 20px;
        }
        .hacker-text { color: #ef4444; font-size: 24px; font-weight: 900; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); animation: glitch 0.3s infinite; }
        .joke-text { color: #eab308; font-size: 28px; font-weight: 900; text-shadow: 0 0 20px rgba(234, 179, 8, 0.8); }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }

        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .social-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s ease; }
        .social-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(168, 85, 247, 0.4); transform: translateY(-2px); }
        .poetry-box { background: linear-gradient(135deg, rgba(168, 85, 247, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
        #toast { transition: all 0.3s ease; transform: translateY(100px); opacity: 0; z-index: 1000; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <!-- شاشة الترحيب الأولى -->
    <div id="splash-screen" onclick="startPrank()">
        <div style="text-align: center; padding: 20px;">
            <h1 class="pulse-text" style="font-size: 22px; font-weight: 900; color: #ffffff; margin-bottom: 10px;">[ انقر للدخول إلى عالم صفصف ]</h1>
            <p style="font-size: 13px; color: #a1a1aa;">Welcome to Safsaf's Realm ✨</p>
        </div>
    </div>

    <!-- شاشة الهكر المرعبة -->
    <div id="hacker-screen">
        <div id="hacker-content">
            <h1 class="hacker-text">⚠️ [ SYSTEM ALERT ] ⚠️<br><br>تم تهكيرك من قبل صفصف 💻🔥</h1>
        </div>
    </div>

    <!-- البطاقة الرئيسية -->
    <main class="w-full max-w-sm md:max-w-md mx-4 my-6 relative z-10">
        <div id="main-card" class="glass-card rounded-3xl p-6 md:p-8 text-center relative overflow-hidden">
            <div class="absolute top-4 left-4 z-20">
                <button id="audio-btn" onclick="toggleAudio()" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white transition-all">
                    <i id="audio-icon" class="fas fa-volume-up text-sm"></i>
                </button>
            </div>
            
            <!-- صورة الساموراي الشخصية -->
            <div class="relative w-28 h-28 mx-auto mb-5">
                <div class="absolute -inset-1 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-400 opacity-70 blur-md"></div>
                <img src="1000092447.jpg" alt="Safsaf Avatar" class="relative w-full h-full object-cover rounded-full border-2 border-white/20 shadow-xl" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
            </div>

            <div class="flex items-center justify-center gap-2
