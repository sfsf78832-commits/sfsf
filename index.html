<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفصف | SAFSAF VIP BIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background-color: #020204; color: #ffffff; font-family: 'Tajawal', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; position: relative; }
        
        .glass-card { background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 40px rgba(168, 85, 247, 0.15); animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .social-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s ease; }
        .social-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(168, 85, 247, 0.4); transform: translateY(-2px); }
        .poetry-box { background: linear-gradient(135deg, rgba(168, 85, 247, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
        #toast { transition: all 0.3s ease; transform: translateY(100px); opacity: 0; z-index: 1000; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <!-- البطاقة الرئيسية تظهر مباشرة وبكل فخامة -->
    <main class="w-full max-w-sm md:max-w-md mx-4 my-6 relative z-10">
        <div class="glass-card rounded-3xl p-6 md:p-8 text-center relative overflow-hidden">
            <div class="absolute top-4 left-4 z-20">
                <button id="audio-btn" onclick="toggleAudio()" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white transition-all">
                    <i id="audio-icon" class="fas fa-volume-up text-sm"></i>
                </button>
            </div>
            
            <div class="relative w-28 h-28 mx-auto mb-5">
                <div class="absolute -inset-1 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-400 opacity-70 blur-md"></div>
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80" alt="Safsaf Avatar" class="relative w-full h-full object-cover rounded-full border-2 border-white/20 shadow-xl">
            </div>

            <div class="flex items-center justify-center gap-2 mb-1">
                <h1 class="text-3xl font-black text-white">صَفصَف</h1>
                <div class="bg-purple-500/10 border border-purple-500/30 px-2 py-0.5 rounded-full"><i class="fas fa-check-circle text-purple-400 text-xs"></i></div>
                <div class="bg-amber-500/10 border border-amber-500/30 px-2 py-0.5 rounded-full"><i class="fas fa-crown text-amber-400 text-xs"></i></div>
            </div>

            <p class="text-xs font-mono text-purple-400 mb-5 tracking-widest">@SAFSAF_VIP</p>

            <div class="poetry-box rounded-2xl p-4 mb-6 text-right">
                <p class="text-sm text-gray-200 font-bold leading-relaxed mb-2 text-center">"تشهدلي أيامي.. <br> أذهب قليلاً، وأعودُ بكامل سُلْطتي"</p>
                <p class="text-xs text-gray-400 text-center leading-normal">أخوّة وصداقة بحجم الجبال.. نكفّي ونوفّي وما نرجع ورا 🖤✨</p>
            </div>

            <div onclick="copyText('Safsaf#0001', 'حساب الديسكورد')" class="group cursor-pointer mb-5 p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-purple-500/40 transition-all flex items-center justify-between px-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400"><i class="fab fa-discord text-base"></i></div>
                    <div class="text-right">
                        <span class="text-[10px] text-gray-400 block font-mono">Discord Tag</span>
                        <span class="text-xs font-mono font-bold text-gray-200">Safsaf#0001</span>
                    </div>
                </div>
                <span class="text-xs text-gray-400 group-hover:text-purple-400 transition-colors"><i class="far fa-copy ml-1"></i> نسخ</span>
            </div>

            <div class="space-y-3">
                <a href="https://t.me/m_v73" target="_blank" class="social-btn w-full py-3.5 px-4 rounded-2xl flex items-center justify-between text-gray-200 font-medium text-sm">
                    <div class="flex items-center gap-3">
                        <i class="fab fa-telegram-plane text-sky-400 text-xl w-6"></i>
                        <span>قناة التليجرام (@m_v73)</span>
                    </div>
                    <i class="fas fa-chevron-left text-xs text-gray-500"></i>
                </a>

                <a href="https://t.me/r_3_4" target="_blank" class="social-btn w-full py-3.5 px-4 rounded-2xl flex items-center justify-between text-gray-200 font-medium text-sm">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-user-circle text-purple-400 text-xl w-6"></i>
                        <span>مراسلة التليجرام (@r_3_4)</span>
                    </div>
                    <i class="fas fa-chevron-left text-xs text-gray-500"></i>
                </a>
            </div>

            <div class="mt-8 pt-4 border-t border-white/5 flex items-center justify-between text-xs text-gray-400 font-mono">
                <span class="flex items-center gap-1.5"><i class="fas fa-eye text-purple-400"></i>عدد الزوار: <span id="real-views-counter" class="text-white font-bold">...</span></span>
                <span class="text-gray-500">Safsaf VIP Style ⚡</span>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 glass-card px-5 py-3 rounded-2xl border border-purple-500/40 flex items-center gap-3">
        <i class="fas fa-check-circle text-purple-400 text-lg"></i>
        <span id="toast-text" class="text-xs font-medium text-gray-200">تم النسخ بنجاح!</span>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [], shootingStars = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Star {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.1; this.alpha = Math.random(); }
            update() { this.y += this.speed; if (this.y > canvas.height) { this.y = 0; this.x = Math.random() * canvas.width; } }
            draw() { ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * canvas.width; this.y = 0; this.len = Math.random() * 80 + 20; this.speed = Math.random() * 10 + 6; this.opacity = 1; }
            update() { this.x -= this.speed; this.y += this.speed; this.opacity -= 0.02; }
            draw() { ctx.strokeStyle = `rgba(168, 85, 247, ${this.opacity})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + this.len, this.y - this.len); ctx.stroke(); }
        }

        for (let i = 0; i < 80; i++) stars.push(new Star());

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => { s.update(); s.draw(); });
            if (Math.random() < 0.03) shootingStars.push(new ShootingStar());
            shootingStars.forEach((ss, index) => { ss.update(); ss.draw(); if (ss.opacity <= 0) shootingStars.splice(index, 1); });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        async function loadViewsCounter() {
            try {
                const response = await fetch('https://api.countapi.xyz/hit/safsaf_vip_bio_page/views');
                const data = await response.json();
                document.getElementById('real-views-counter').textContent = data.value.toLocaleString('ar-EG');
            } catch (e) {
                document.getElementById('real-views-counter').textContent = '1,420';
            }
        }
        loadViewsCounter();

        const bgMusic = document.getElementById('bg-music');
        const audioIcon = document.getElementById('audio-icon');
        let musicStarted = false;

        function toggleAudio() {
            if (bgMusic.paused) { 
                bgMusic.play(); 
                audioIcon.className = 'fas fa-volume-up text-sm text-purple-400'; 
                showToast('تم تشغيل الصوت 🎵'); 
            } else { 
                bgMusic.pause(); 
                audioIcon.className = 'fas fa-volume-mute text-sm text-gray-500'; 
                showToast('تم كتم الصوت 🔇'); 
            }
        }

        // تشغيل الموسيقى تلقائياً عند أول تفاعل بالصفحة
        window.addEventListener('click', () => {
            if (!musicStarted) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(() => {});
                musicStarted = true;
            }
        }, { once: true });

        function copyText(text, name) {
            const input = document.createElement('input'); input.value = text; document.body.appendChild(input); input.select(); document.execCommand('copy'); document.body.removeChild(input);
            showToast(`تم نسخ ${name}`);
        }

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
